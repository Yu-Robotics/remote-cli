<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>想看执行细节，点开工具那一行</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 20</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">想看执行细节，点开工具那一行</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">展开工具记录，直接查看调用参数和返回内容，不用只猜摘要的意思。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">点击工具行 → 查看 Input 和 Result</text><rect x="64" y="312" width="936" height="642" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="355" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="333" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="355" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,391 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><circle cx="102" cy="430" r="4" fill="#68b76b"/><text x="120" y="432" font-size="20" fill="#646a73" font-weight="400">Bash · Run project tests</text><path d="M944,424 l8,8 l8,-8" fill="none" stroke="#646a73" stroke-width="2"/><rect x="98" y="475" width="854" height="342" rx="8" fill="#f8f9fb" stroke="#e0e3e8" stroke-width="1.4" /><text x="122" y="515" font-size="20" fill="#1f2329" font-weight="400">Status: Succeeded</text><text x="122" y="566" font-size="23" fill="#1f2329" font-weight="600">Input</text><text x="122" y="607" font-size="22" fill="#1f2329" font-weight="400">npm test</text><text x="122" y="684" font-size="23" fill="#1f2329" font-weight="600">Result</text><text x="122" y="729" font-size="22" fill="#1f2329" font-weight="400">Tests: 12 passed</text><rect x="88" y="406" width="872" height="55" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="403" r="18" fill="#245bdb"/><text x="74.1015625" y="408" font-size="20" fill="white" font-weight="600">1</text><rect x="106" y="648" width="822" height="102" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="98" cy="645" r="18" fill="#245bdb"/><text x="92.1015625" y="650" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在卡片中点击</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">点开工具这一行</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">找到工具记录</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">例如 Bash 或 Read</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">点开工具这一行</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">Input 查看调用参数</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">Result 查看返回内容</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">长内容可能只显示部分</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">查看调用和结果，展开原工具行</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>