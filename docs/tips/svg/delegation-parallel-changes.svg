<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>几项独立修改，同时推进</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 03</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">几项独立修改，同时推进</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">在 Git 项目中把独立修改交给不同助手，可以按可用执行名额同时推进，再统一整合和验证。</text><rect x="104" y="228" width="868" height="96" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">请把互不依赖的修改分给不同助手，在各自 Git 工作树中完成；全部结束后显式整合</text><text x="128" y="296" font-size="22" fill="#1f3864" font-weight="400">，检查冲突并运行必要测试。</text><rect x="64" y="346" width="936" height="608" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="389" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="367" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="389" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,425 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><path d="M94,446 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><rect x="98" y="472" width="23" height="18" rx="4" fill="none" stroke="#9256d9" stroke-width="1.4" /><path d="M109,472 v-6 M94,477 v9 M125,477 v9" stroke="#9256d9" stroke-width="2.5"/><circle cx="105" cy="481" r="2" fill="#9256d9"/><circle cx="114" cy="481" r="2" fill="#9256d9"/><text x="137" y="487" font-size="23" fill="#1f2329" font-weight="600">Codex · #1</text><rect x="870.578125" y="466" width="90.421875" height="31" rx="5" fill="#eaf0fd" /><text x="880.578125" y="486" font-size="18" fill="#245bdb" font-weight="400">Running</text><text x="98" y="529" font-size="17" fill="#646a73" font-weight="400">Activity</text><text x="98" y="566" font-size="21" fill="#1f2329" font-weight="400">Update log export in an independent Git worktree.</text><path d="M94,599.55 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><rect x="98" y="625.55" width="23" height="18" rx="4" fill="none" stroke="#9256d9" stroke-width="1.4" /><path d="M109,625.55 v-6 M94,630.55 v9 M125,630.55 v9" stroke="#9256d9" stroke-width="2.5"/><circle cx="105" cy="634.55" r="2" fill="#9256d9"/><circle cx="114" cy="634.55" r="2" fill="#9256d9"/><text x="137" y="640.55" font-size="23" fill="#1f2329" font-weight="600">Claude Code · #2</text><rect x="870.578125" y="619.55" width="90.421875" height="31" rx="5" fill="#eaf0fd" /><text x="880.578125" y="639.55" font-size="18" fill="#245bdb" font-weight="400">Running</text><text x="98" y="682.55" font-size="17" fill="#646a73" font-weight="400">Activity</text><text x="98" y="719.55" font-size="21" fill="#1f2329" font-weight="400">Update configuration validation in another worktree.</text><text x="98" y="772.0999999999999" font-size="19" fill="#646a73" font-weight="400">Integration and verification follow after all workers finish.</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">委派功能需已开启</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/delegation</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">拆分独立修改</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">分别安排各自的工作范围</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">按名额同时执行</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">完成后整合并测试</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">确认实际交付</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">非 Git 目录仍按顺序执行</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">独立修改可并行，交付仍需整合验证</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>