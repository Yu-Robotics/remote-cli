<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>对话已经很长，继续推进当前工作</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 16</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">对话已经很长，继续推进当前工作</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">可以尝试压缩已有对话，减少继续处理时携带的历史，具体效果由后端决定。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">/compact</text><rect x="64" y="312" width="936" height="642" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="355" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="333" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="355" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,391 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="436" font-size="24" fill="#1f2329" font-weight="600">Compressing conversation history…</text><path d="M98,481 H966" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="536" font-size="24" fill="#1f2329" font-weight="400">Conversation history compressed</text><text x="98" y="590" font-size="20" fill="#368544" font-weight="400">Completed</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/compact</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">当前工作还需继续</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">对话已长但任务尚未结束</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">空闲后尝试压缩</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">按后端支持方式延续工作</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">信息可能不完整</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">压缩或摘要不保证保留全部细节</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">长对话可尝试压缩，不能承诺无损保留</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>