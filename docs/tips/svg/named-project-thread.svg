<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>新项目，单独开一个线程</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 19</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">新项目，单独开一个线程</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">为项目创建有名字的独立线程，各自保留讨论、目录和任务队列。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">/thread new website</text><rect x="64" y="312" width="936" height="642" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="355" font-size="23" fill="#1f2329" font-weight="600">website</text><rect x="190" y="333" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="355" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,391 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="437" font-size="25" fill="#1f2329" font-weight="600">Thread &quot;website&quot; created.</text><text x="98" y="489" font-size="22" fill="#1f2329" font-weight="400">Reply to this card to send the first command to the new thread.</text><rect x="104" y="592" width="850" height="90" rx="10" fill="#e1ebff" /><text x="128" y="619" font-size="17" fill="#646a73" font-weight="400">Reply to: website</text><text x="128" y="657" font-size="25" fill="#245bdb" font-weight="600">/cd</text><text x="98" y="758" font-size="21" fill="#646a73" font-weight="400">website · /workspace/demo · Codex</text><rect x="98" y="807" width="89.25" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="114" y="836" font-size="20" fill="#1f2329" font-weight="400">+ New</text><rect x="88" y="401" width="848" height="127" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="398" r="18" fill="#245bdb"/><text x="74.1015625" y="403" font-size="20" fill="white" font-weight="600">1</text><rect x="98" y="586" width="862" height="102" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="90" cy="583" r="18" fill="#245bdb"/><text x="84.1015625" y="588" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/thread new website</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">创建命名线程</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">发送 /thread new website</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">回复新线程卡片</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">再发送 /cd 选择目录</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">确认后开始任务</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">+ New 不等于 /new</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">先创建独立线程，再选择项目目录</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>