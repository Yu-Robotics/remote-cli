<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>让某种委派助手重新开始</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 22</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">让某种委派助手重新开始</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">只清理指定后端的委派会话，主助手和其他后端继续保留讨论。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">/delegation reset opencode</text><rect x="64" y="312" width="936" height="642" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="355" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="333" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="355" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,391 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="436" font-size="24" fill="#1f2329" font-weight="600">Reset OpenCode CLI worker context (1 lane removed).</text><path d="M94,557 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><rect x="98" y="583" width="23" height="18" rx="4" fill="none" stroke="#9256d9" stroke-width="1.4" /><path d="M109,583 v-6 M94,588 v9 M125,588 v9" stroke="#9256d9" stroke-width="2.5"/><circle cx="105" cy="592" r="2" fill="#9256d9"/><circle cx="114" cy="592" r="2" fill="#9256d9"/><text x="137" y="598" font-size="23" fill="#1f2329" font-weight="600">OpenCode · #1</text><rect x="848.265625" y="577" width="112.734375" height="31" rx="5" fill="#e8f5e6" /><text x="858.26562