<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>多项检查，分别安排助手处理</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 02</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">多项检查，分别安排助手处理</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">把互不依赖的检查分别交给助手，再由主助手汇总核实，可以让每项检查都有明确范围和结果。</text><rect x="104" y="228" width="868" height="96" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">请分别委派检查本次实现、测试覆盖和文档一致性，只读不改文件；各自返回问题与</text><text x="128" y="296" font-size="22" fill="#1f3864" font-weight="400">依据，由你汇总核实。</text><rect x="64" y="346" width="936" height="608" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="389" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="367" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="389" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,425 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><path d="M94,446 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><rect x="98" y="472" width="23" height="18" rx="4" fill="none" stroke="#9256d9" stroke-width="1.4" /><path d="M109,472 v-6 M94,477 v9 M125,477 v9" stroke="#9256d9" stroke-width="2.5"/><circle cx="105" cy="481" r="2" fill="#9256d9"/><circle cx="114" cy="481" r="2" fill="#9256d9"/><text x="137" y="487" font-size="23" fill="#1f2329" font-weight="600">Codex · #1</text><rect x="848.265625" y="466" width="112.734375" height="31" rx="5" fill="#e8f5e6" /><text x="858.265625" y="486" fon