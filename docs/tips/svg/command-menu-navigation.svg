<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>从 /skills 菜单找到定时任务</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 28</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">从 /skills 菜单找到定时任务</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">打开飞书命令菜单，就能找到任务列表和创建表单。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">/skills</text><rect x="64" y="312" width="936" height="642" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="98" y="364" font-size="30" fill="#245bdb" font-weight="600">Remote CLI commands</text><text x="98" y="425" font-size="26" fill="#1f2329" font-weight="600">Quick access</text><rect x="105" y="465" width="226.515625" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="121" y="498" font-size="24" fill="#1f2329" font-weight="400">Scheduled tasks ›</text><path d="M98,563 H964" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="626" font-size="30" fill="#245bdb" font-weight="600">/schedule</text><rect x="105" y="677" width="261.390625" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="121" y="709" font-size="23" fill="#1f2329" font-weight="400">list · Scheduled tasks</text><rect x="522" y="677" width="285.53125" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="538" y="709" font-size="23" fill="#1f2329" font-weight="400">after · Run after a delay</text><rect x="105" y="766" width=