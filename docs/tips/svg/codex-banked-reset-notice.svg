<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>彩蛋：重置卡增加了也能收到提醒</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 27</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">彩蛋：重置卡增加了也能收到提醒</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">同一账号可用重置卡张数增加时，工具会在飞书展示前后数量和本次增加量。</text><rect x="64" y="224" width="936" height="730" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><rect x="65" y="225" width="934" height="58" rx="11" fill="#eaf0ff" /><rect x="65" y="260" width="934" height="23" rx="0" fill="#eaf0ff" /><text x="94" y="261" font-size="25" fill="#245bdb" font-weight="600">🎁 Codex Banked Reset</text><text x="98" y="345" font-size="26" fill="#1f2329" font-weight="600">Banked Reset balance increased: 3 → 5 (+2)</text><text x="98" y="410.3" font-size="23" fill="#646a73" font-weight="400">Backend: Codex CLI</text><text x="98" y="473.95" font-size="23" fill="#646a73" font-weight="400">Available at the latest check: 5. This reminder does not consume reset credits.</text><rect x="88" y="309" width="864" height="65.30000000000001" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="306" r="18" fill="#245bdb"/><text x="74.1015625" y="311" font-size="20" fill="white" font-weight="600">1</text><rect x="88" y="440.95" width="864" height="60.64999999999992" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="437.95" r="18" fill="#245bdb"/><text x="74.1015625" y="442.95" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">符合条件时自动提醒</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">Codex Banked Reset</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">认准 Banked Reset 卡</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">原生可用张数增加才提醒</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">查看前后张数和增加量</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">示意 3 → 5，增加 2 张</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">不负责发放或使用卡</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">首次检测和重启不补发提醒</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">这是张数增加通知，不是领卡或用卡入口</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>