<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>根据可用额度，调整后续分工</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 06</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">根据可用额度，调整后续分工</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">根据自己已确认的服务额度，手动把后续工作分配给其他可用后端，可以调整接下来的分工。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">后续资料检查改用 Kimi，你继续负责整体任务和结果汇总。</text><rect x="64" y="312" width="936" height="642" rx="12" fill="#292b2f" stroke="#45484d" stroke-width="1.4" /><text x="94" y="355" font-size="23" fill="#f0f1f3" font-weight="600">demo</text><rect x="190" y="333" width="280" height="36" rx="4" fill="#202125" /><text x="201" y="355" font-size="19" fill="#f0f1f3" font-weight="400">/workspace/demo</text><path d="M94,391 H970" fill="none" stroke="#45484d" stroke-width="1.4"/><text x="98" y="434" font-size="22" fill="#f0f1f3" font-weight="400">I will assign the next documentation check to Kimi and summarize the result here.</text><path d="M94,470.1 H970" fill="none" stroke="#45484d" stroke-width="1.4"/><rect x="98" y="496.1" width="23" height="18" rx="4" fill="none" stroke="#9256d9" stroke-width="1.4" /><path d="M109,496.1 v-6 M94,501.1 v9 M125,501.1 v9" stroke="#9256d9" stroke-width="2.5"/><circle cx="105" cy="505.1" r="2" fill="#9256d9"/><circle cx="114" cy="505.1" r="2" fill="#9256d9"/><text x="137" y="511.1" font-size="23" fill="#f0f1f3" font-weight="600">Kimi Code · #1</text><rect x="848.265625" y="490.1" width="112.734375" height="31" rx="5" fill="#254530" /><text x="858.265625" y="510.1" font-size="18" fill="#76cf7d" font-weight="400">Completed</text><text x="98" y="553.1" font-size="17" fill="#b5b8bd" font-weight="400">Result excerpt</text><text x="98" y="590.1" font-size="21" fill="#f0f1f3" font-weight="400">Documentation checked. Two outdated examples found.</text><text x="98" y="659.65" font-size="20" fill="#b5b8bd" font-weight="400">No running task was moved; this is a new assignment.</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">委派功能需已开启</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/delegation</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">自行确认额度</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">核对目标服务是否可继续使用</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">调整后续分工</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">明确下一项交给哪个后端</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">额度不会自动汇集</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">不转移余额，也不中途迁移任务</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">按已知额度手动安排后续工作</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>