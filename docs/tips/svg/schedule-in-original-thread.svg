<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>每个工作日九点，把 CI 失败报回原线程</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 29</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">每个工作日九点，把 CI 失败报回原线程</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">在项目线程里设好时间，之后每次巡检的结果都会发回这里。</text><rect x="64" y="228" width="936" height="726" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="271" font-size="23" fill="#1f2329" font-weight="600">CI</text><rect x="190" y="249" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="271" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,307 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="103" y="376" font-size="48" fill="#245bdb" font-weight="600">09:00</text><text x="280" y="373" font-size="28" fill="#1f2329" font-weight="400">北京时间</text><rect x="105" y="431" width="89" height="72" rx="8" fill="#e1ebff" /><text x="133" y="473" font-size="31" fill="#245bdb" font-weight="600">一</text><rect x="220" y="431" width="89" height="72" rx="8" fill="#e1ebff" /><text x="248" y="473" font-size="31" fill="#245bdb" font-weight="600">二</text><rect x="335" y="431" width="89" height="72" rx="8" fill="#e1ebff" /><text x="363" y="473" font-size="31" fill="#245bdb" font-weight="600">三</text><rect x="450" y="431" width="89" height="72" rx="8" fill="#e1ebff" /><text x="478" y="473" font-size="31" fill="#245bdb" font-weight="600">四</text><rect x="565" y="431" width="89" height="72" rx="8" fill="#e1ebff" /><text x="593" y="473" font-size="31" fill="#245bdb" font-weight="600">五</text><rect x="680" y="431" width="89" height="72" rx="8" fill="#f3f4f5" /><text x="708" y="473" font-size="31" fill="#646a73" font-weight="400">六</text><rect x="795" y="431" width="89" height="72" rx="8" fill="#f3f4f5" /><text x="823" y="473" font-size="31" fill="#646a73" font-weight="400">日</text><text x="105" y="569" font-size="24" fill="#646a73" font-weight="400">0 9 * * 1-5     ·     Asia/Shanghai</text><path d="M98,628 H962" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="105" y="706" font-size="30" fill="#1f2329" font-weight="600">项目线程收到巡检结果</text><rect x="105" y="758" width="825" height="88" rx="9" fill="#edf3ff" /><text x="134" y="806" font-size="28" fill="#1f2329" font-weight="400">CI 检查失败：网页测试超时</text><rect x="99" y="425" width="561" height="84" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="91" cy="422" r="18" fill="#245bdb"/><text x="85.1015625" y="427" font-size="20" fill="white" font-weight="600">1</text><rect x="99" y="752" width="837" height="100" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="91" cy="749" r="18" fill="#245bdb"/><text x="85.1015625" y="754" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/schedule list</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">在项目线程设定时间</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">周一至周五 09:00，北京时间</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">在原线程收报告</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">报告列出哪些 CI 检查失败了</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">到点保持 CLI 在线</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">发送 /schedule list 核对计划</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">在哪个线程安排巡检，就在哪个线程收结果。</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>