<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>代码改完，再请另一种AI检查</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 01</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">代码改完，再请另一种AI检查</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">让另一种 AI 检查实际交付的修改，再由主助手核实问题和依据，可以多获得一个独立视角。</text><rect x="104" y="228" width="868" height="96" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">请先委派实现本次修改，结束后显式整合；再请另一种可用的 AI 只读审查整合后的</text><text x="128" y="296" font-size="22" fill="#1f3864" font-weight="400">代码，由你核实问题并报告验证结果。</text><rect x="64" y="346" width="936" height="608" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="389" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="367" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="389" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,425 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><path d="M94,446 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><rect x="98" y="472" width="23" height="18" rx="4" fill="none" stroke="#9256d9" stroke-width="1.4" /><path d="M109,472 v-6 M94,477 v9 M125,477 v9" stroke="#9256d9" stroke-width="2.5"/><circle cx="105" cy="481" r="2" fill="#9256d9"/><circle cx="114" cy="481" r="2" fill="#9256d9"/><text x="137" y="487" font-size="23" fill="#1f2329" font-weight="600">Codex · #1</text><rect x="848.265625" y="466" width="112.734375" height="31" rx="5" fill="#e8f5e6" /><text x="858.265625" y="486" font-size="18" fill="#368544" font-weight="400">Completed</text><text x="98" y="533" font-size="21" fill="#1f2329" font-weight="400">Input validation updated. Changes integrated before review.</text><path d="M94,566.55 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><rect x="98" y="592.55" width="23" height="18" rx="4" fill="none" stroke="#9256d9" stroke-width="1.4" /><path d="M109,592.55 v-6 M94,597.55 v9 M125,597.55 v9" stroke="#9256d9" stroke-width="2.5"/><circle cx="105" cy="601.55" r="2" fill="#9256d9"/><circle cx="114" cy="601.55" r="2" fill="#9256d9"/><text x="137" y="607.55" font-size="23" fill="#1f2329" font-weight="600">Claude Code · #2</text><rect x="848.265625" y="586.55" width="112.734375" height="31" rx="5" fill="#e8f5e6" /><text x="858.265625" y="606.55" font-size="18" fill="#368544" font-weight="400">Completed</text><text x="98" y="653.55" font-size="21" fill="#1f2329" font-weight="400">Reviewed the integrated changes. One missing edge case found.</text><text x="98" y="716.0999999999999" font-size="21" fill="#1f2329" font-weight="400">Review verified; the missing test was added.</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">委派功能需已开启</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/delegation</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">先完成实现</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">检查并整合实际修改</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">再独立审查</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">交给另一种可用助手</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">核实审查结论</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">主助手对照代码与证据</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">先整合实现，再独立审查并核实</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>