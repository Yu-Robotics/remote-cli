<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>不同项目，保留各自的AI选择</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 08</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">不同项目，保留各自的AI选择</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">为当前项目所在的线程保存后端选择，可以让其他项目继续沿用各自的设置。</text><rect x="64" y="224" width="936" height="730" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><rect x="65" y="225" width="934" height="58" rx="11" fill="#eaf0ff" /><rect x="65" y="260" width="934" height="23" rx="0" fill="#eaf0ff" /><text x="94" y="261" font-size="25" fill="#245bdb" font-weight="600">⚙️ Backend settings</text><text x="94" y="328" font-size="21" fill="#1f2329" font-weight="600">Backend · demo</text><path d="M94,353.55 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="94" y="397.55" font-size="22" fill="#1f2329" font-weight="600">1 · Choose backend</text><rect x="94" y="422.65000000000003" width="232.453125" height="47" rx="8" fill="white" stroke="#245bdb" stroke-width="1.4" /><text x="110" y="449.65000000000003" font-size="18" fill="#245bdb" font-weight="400">✓ Claude Code (current)</text><rect x="336.453125" y="422.65000000000003" width="192.796875" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="352.453125" y="449.65000000000003" font-size="18" fill="#1f2329" font-weight="400">Codex CLI (OpenAI)</text><rect x="539.25" y="422.65000000000003" width="151.5625" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="555.25" y="449.65000000000003" font-size="18" fill="#1f2329" font-weight="400">OpenCode CLI</text><rect x="700.8125" y="422.65000000000003" width="148.328125" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="716.8125" y="449.65000000000003" font-size="18" fill="#1f2329" font-weight="400">Kimi Code CLI</text><rect x="94" y="486.65000000000003" width="85.984375" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="110" y="513.6500000000001" font-size="18" fill="#1f2329" font-weight="400">ZCode</text><rect x="189.984375" y="486.65000000000003" width="48.34375" height="47" rx="8" fill="#fcfcfd" stroke="#d0d2d5" stroke-width="1.4" /><text x="205.984375" y="513.6500000000001" font-size="18" fill="#b6b8bd" font-weight="400">Pi</text><rect x="248.328125" y="486.65000000000003" width="202.40625" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="264.328125" y="513.6500000000001" font-size="18" fill="#1f2329" font-weight="400">AGY CLI (Antigravity)</text><rect x="460.734375" y="486.65000000000003" width="240.578125" height="47" rx="8" fill="#fcfcfd" stroke="#d0d2d5" stroke-width="1.4" /><text x="476.734375" y="513.6500000000001" font-size="18" fill="#b6b8bd" font-weight="400">DeepSeek Harness (DSH)</text><path d="M94,555.6500000000001 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="94" y="599.6500000000001" font-size="22" fill="#1f2329" font-weight="600">2 · Apply to</text><rect x="94" y="624.7500000000001" width="171.53125" height="47" rx="8" fill="white" stroke="#245bdb" stroke-width="1.4" /><text x="110" y="651.7500000000001" font-size="18" fill="#245bdb" font-weight="400">✓ Current thread</text><rect x="275.53125" y="624.7500000000001" width="121.078125" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="291.53125" y="651.7500000000001" font-size="18" fill="#1f2329" font-weight="400">All threads</text><rect x="406.609375" y="624.7500000000001" width="251.125" height="47" rx="8" fill="white" stroke="#d0d2d5" stroke-width="1.4" /><text x="422.609375" y="651.7500000000001" font-size="18" fill="#1f2329" font-weight="400">Follow global (this thread)</text><rect x="88" y="416.65000000000003" width="244.453125" height="59" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="413.65000000000003" r="18" fill="#245bdb"/><text x="74.1015625" y="418.65000000000003" font-size="20" fill="white" font-weight="600">2</text><rect x="88" y="618.7500000000001" width="183.53125" height="59" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="615.7500000000001" r="18" fill="#245bdb"/><text x="74.1015625" y="620.7500000000001" font-size="20" fill="white" font-weight="600">1</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/backend</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">打开后端设置</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">确认目标是当前项目的线程</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">仅应用当前线程</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">选择后等待成功回执</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">其他项目不变</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">每个线程保留自己的后端选择</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">保存当前项目的选择，不影响其他线程</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>