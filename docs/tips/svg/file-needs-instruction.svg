<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>手机收到的文档，直接交给电脑处理</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 12</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">手机收到的文档，直接交给电脑处理</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">把文档发到已授权接收文件的电脑，再说明分析要求，可以从手机继续处理资料。</text><rect x="64" y="228" width="936" height="726" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="271" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="249" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="271" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,307 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="354" font-size="26" fill="#1f2329" font-weight="600">File · parsed</text><rect x="98" y="388" width="842" height="171" rx="9" fill="#f8f9fb" stroke="#dfe2e7" stroke-width="1.4" /><text x="124" y="434" font-size="26" fill="#1f2329" font-weight="600">demo-report.pdf</text><text x="124" y="481" font-size="22" fill="#368544" font-weight="400">Original saved · Parsed</text><text x="124" y="525" font-size="20" fill="#646a73" font-weight="400">Device: demo-laptop · Thread: demo</text><path d="M98,597 H966" fill="none" stroke="#dee0e3" stroke-width="1.4"/><rect x="98" y="634" width="842" height="119" rx="10" fill="#e1ebff" /><text x="121" y="675" font-size="23" fill="#1f3864" font-weight="400">请总结这份报告的三个结论，并标明依据；未能读取的内容请明确说明。</text><text x="98" y="819" font-size="21" fill="#646a73" font-weight="400">Saving a file does not start a model task.</text><rect x="92" y="382" width="854" height="183" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="84" cy="379" r="18" fill="#245bdb"/><text x="78.1015625" y="384" font-size="20" fill="white" font-weight="600">1</text><rect x="92" y="628" width="854" height="131" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="84" cy="625" r="18" fill="#245bdb"/><text x="78.1015625" y="630" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">先上传，再发送指令</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">上传文档</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">选择已完成文件接收授权的电脑</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">再发送分析要求</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">回复文件或状态卡说明任务</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">先看实际读取范围</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">上传不是任务，解析也可能不完整</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">先传资料，再说明需要电脑完成的任务</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>