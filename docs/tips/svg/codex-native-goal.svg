<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>给 Codex 一个持续推进的目标</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 24</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">给 Codex 一个持续推进的目标</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">支持原生目标的 Codex 可以继续推进工作，并保留查看、暂停和恢复入口。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">/delegation off</text><rect x="64" y="312" width="936" height="642" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="355" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="333" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="355" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,391 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="435" font-size="23" fill="#1f2329" font-weight="600">Delegation is off for this thread.</text><rect x="98" y="482" width="854" height="100" rx="9" fill="#e1ebff" /><text x="120" y="517" font-size="22" fill="#1f3864" font-weight="400">/goal --budget 40000 修复失败的测试并保持公开接口兼容</text><text x="98" y="662" font-size="25" fill="#1f2329" font-weight="600">Codex goal</text><text x="98" y="713" font-size="23" fill="#1f2329" font-weight="400">Status: active</text><text x="98" y="757" font-size="23" fill="#1f2329" font-weight="400">Token budget: 40000</text><text x="98" y="825" font-size="23" fill="#245bdb" font-weight="400">/goal   /goal pause   /goal resume</text><rect x="92" y="476" width="866" height="112" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="84" cy="473" r="18" fill="#245bdb"/><text x="78.1015625" y="478" font-size="20" fill="white" font-weight="600">1</text><rect x="88" y="788" width="847" height="67" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="785" r="18" fill="#245bdb"/><text x="74.1015625" y="790" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/delegation off</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">设置明确目标</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">先关闭委派，再发 /goal</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">查看、暂停或恢复</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">用 /goal 及其子命令操作</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">预算限制 token 上限</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">清除目标保留对话</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">目标交给 Codex 推进，状态由你掌握</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>