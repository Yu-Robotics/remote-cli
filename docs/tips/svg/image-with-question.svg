<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>遇到界面问题，把截图和问题一起发</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 13</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">遇到界面问题，把截图和问题一起发</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">把截图和明确的问题放在一起，可以让支持图像的助手结合画面检查，减少来回确认。</text><rect x="64" y="228" width="936" height="726" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><rect x="94" y="256" width="876" height="537" rx="12" fill="#e1ebff" /><rect x="120" y="280" width="823" height="309" rx="8" fill="white" stroke="#cad4e5" stroke-width="1.4" /><rect x="120" y="280" width="823" height="46" rx="8" fill="#f0f2f5" /><text x="143" y="310" font-size="21" fill="#1f2329" font-weight="600">Demo settings</text><text x="153" y="375" font-size="23" fill="#1f2329" font-weight="400">Display name</text><rect x="153" y="400" width="446" height="49" rx="7" fill="white" stroke="#d6d9df" stroke-width="1.4" /><text x="170" y="430" font-size="20" fill="#646a73" font-weight="400">Demo project</text><rect x="153" y="493" width="194" height="49" rx="7" fill="#245bdb" /><text x="174" y="522" font-size="20" fill="white" font-weight="400">Save changes</text><rect x="120" y="515" width="823" height="74" rx="4" fill="#f0f2f5" /><text x="143" y="556" font-size="20" fill="#646a73" font-weight="400">Example: footer overlaps the button</text><text x="120" y="655" font-size="23" fill="#1f3864" font-weight="400">请看截图右下角的报错，解释可能原因，并说明还需要哪些信息，暂时不要修改</text><text x="120" y="690.65" font-size="23" fill="#1f3864" font-weight="400">文件。</text><text x="98" y="854" font-size="22" fill="#646a73" font-weight="400">One message · text + image</text><rect x="114" y="274" width="835" height="321" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="106" cy="271" r="18" fill="#245bdb"/><text x="100.1015625" y="276" font-size="20" fill="white" font-weight="600">1</text><rect x="107" y="616" width="842" height="144" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="99" cy="613" r="18" fill="#245bdb"/><text x="93.1015625" y="618" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">截图和问题放在同一条消息</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">准备截图与问题</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">指出需要检查的位置和现象</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">放进同一条消息</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">用富文本一起发送图文</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">先确认支持图像</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">单独发图会作为描述图片的任务</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">截图和具体问题放在同一条图文消息里</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>