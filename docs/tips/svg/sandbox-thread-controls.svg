<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="1120" viewBox="0 0 1600 1120"><title>需要限制命令执行，先查看沙箱</title><desc>Source-informed UI reconstruction with synthetic content. No screenshot pixels, real identities, paths, or business records are embedded.</desc><g font-family="Noto Sans CJK SC, sans-serif"><rect x="0" y="0" width="1600" height="1120" rx="0" fill="#f7f9fc" /><rect x="64" y="40" width="190" height="32" rx="16" fill="#eaf0fd" /><text x="80" y="60" font-size="15" fill="#245bdb" font-weight="600">REMOTE CLI / TIP 25</text><text x="64" y="135" font-size="43" fill="#1f2329" font-weight="600">需要限制命令执行，先查看沙箱</text><text x="66" y="179" font-size="23" fill="#646a73" font-weight="400">在支持的 Codex 或 Claude Code 线程里，查看并选择原生命令沙箱限制。</text><rect x="104" y="228" width="868" height="62" rx="12" fill="#e1ebff" /><text x="128" y="262" font-size="22" fill="#1f3864" font-weight="400">/sandbox</text><rect x="64" y="312" width="936" height="642" rx="12" fill="white" stroke="#d9dce1" stroke-width="1.4" /><text x="94" y="355" font-size="23" fill="#1f2329" font-weight="600">demo</text><rect x="190" y="333" width="280" height="36" rx="4" fill="#f3f4f5" /><text x="201" y="355" font-size="19" fill="#1f2329" font-weight="400">/workspace/demo</text><path d="M94,391 H970" fill="none" stroke="#dee0e3" stroke-width="1.4"/><text x="98" y="437" font-size="25" fill="#1f2329" font-weight="600">Codex sandbox</text><text x="98" y="496" font-size="24" fill="#1f2329" font-weight="400">Mode: read-only</text><rect x="98" y="572" width="854" height="85" rx="9" fill="#e1ebff" /><text x="122" y="621" font-size="25" fill="#245bdb" font-weight="600">/sandbox read-only</text><text x="98" y="745" font-size="23" fill="#646a73" font-weight="400">Native command policy for this thread.</text><text x="98" y="780.65" font-size="23" fill="#646a73" font-weight="400">Not whole-process isolation.</text><rect x="88" y="457" width="847" height="67" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="80" cy="454" r="18" fill="#245bdb"/><text x="74.1015625" y="459" font-size="20" fill="white" font-weight="600">1</text><rect x="92" y="566" width="866" height="97" rx="10" fill="none" stroke="#8faff1" stroke-width="1.4" stroke-dasharray="5 5"/><circle cx="84" cy="563" r="18" fill="#245bdb"/><text x="78.1015625" y="568" font-size="20" fill="white" font-weight="600">2</text><text x="1054" y="257" font-size="21" fill="#646a73" font-weight="400">在飞书中发送</text><rect x="1054" y="280" width="450" height="72" rx="12" fill="white" stroke="#dce2eb" stroke-width="1.4" /><text x="1076" y="317" font-size="25" fill="#245bdb" font-weight="600">/sandbox</text><circle cx="1072" cy="425" r="18" fill="#245bdb"/><text x="1066.1015625" y="430" font-size="20" fill="white" font-weight="600">1</text><text x="1106" y="430" font-size="25" fill="#1f2329" font-weight="600">查看当前沙箱状态</text><text x="1054" y="494" font-size="23" fill="#646a73" font-weight="400">发送 /sandbox</text><circle cx="1072" cy="617" r="18" fill="#245bdb"/><text x="1066.1015625" y="622" font-size="20" fill="white" font-weight="600">2</text><text x="1106" y="622" font-size="25" fill="#1f2329" font-weight="600">按后端支持选择限制</text><text x="1054" y="686" font-size="23" fill="#646a73" font-weight="400">只作用于当前线程</text><rect x="1054" y="806" width="450" height="144" rx="12" fill="#edf3ff" /><text x="1076" y="846" font-size="24" fill="#245bdb" font-weight="600">不等于整个进程隔离</text><text x="1076" y="886" font-size="20" fill="#245bdb" font-weight="400">与 /cd 目录白名单不同</text><path d="M64,994 H1536" fill="none" stroke="#dce2eb" stroke-width="1.4"/><text x="66" y="1031" font-size="22" fill="#646a73" font-weight="400">先看支持范围，再选择命令沙箱模式</text><text x="66" y="1078" font-size="18" fill="#8b919c" font-weight="400">操作示意，内容均为虚构示例；仅展示与本条技巧相关的区域。</text></g></svg>