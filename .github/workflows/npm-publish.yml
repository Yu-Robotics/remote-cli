name: Publish npm packages

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      version:
        description: 'Exact release version already committed on main (manual recovery)'
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: Build and test (${{ matrix.os }}, CLI shard ${{ matrix.shard }}/2)
    runs-on: ${{ matrix.os }}
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        # Keep native macOS checks on the Intel pool while hosted arm64 capacity is constrained.
        os: [ubuntu-latest, macos-15-intel, windows-latest]
        shard: [1, 2]
    steps:
      - name: Preserve checkout line endings on Windows
        if: runner.os == 'Windows'
        run: git config --global core.autocrlf false
      - name: Check out the tested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Require Git LFS for filesystem tests
        run: git lfs version
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Install the release npm version
        run: npm install --global npm@11.21.1
      - name: Install locked dependencies
        run: npm ci
      - name: Build both packages
        run: npm run build
      - name: Test CLI shard
        run: npm test -w @yu_robotics/remote-cli -- --shard=${{ matrix.shard }}/2 --poolOptions.forks.maxForks=1 --poolOptions.forks.minForks=1 --testTimeout=30000
      - name: Test Router
        if: matrix.shard == 1
        run: npm test -w @yu_robotics/remote-cli-router -- --poolOptions.forks.maxForks=1 --poolOptions.forks.minForks=1 --testTimeout=30000

  native-cleanup:
    name: Native cleanup (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-15-intel, macos-15, windows-latest, windows-11-arm]
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - name: Build native helper and packages
        run: npm run build
      - name: Exercise native cleanup success and isolation
        run: npm test -w @yu_robotics/remote-cli -- tests/output/OutputFiles.test.ts tests/output/Durable.test.ts NativeHistoryAnchor.test.ts ManagedSpawn.native.test.ts OpenCodeDeletionTransport.test.ts AgyExecutor.test.ts ManagedHistoryBackends.test.ts ManagedRemainingHistoryBackends.test.ts ZCodeClient.test.ts NativeHistoryFiles.test.ts AgySessionDeletion.test.ts DshSessionDeletion.test.ts OpenCodeSessionDeletion.test.ts KimiSessionDeletion.test.ts ZCodeSessionDeletion.test.ts --pool=forks --maxWorkers=1 --minWorkers=1
      - name: Check the published helper on minimum supported Node
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: ${{ matrix.os == 'windows-11-arm' && '22' || '18' }}
          package-manager-cache: false
      - name: Verify Node-API compatibility
        run: node -e "require('./packages/cli/dist/native/NativeBindings').nativeBindings()"
      - name: Upload the tested native helper
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: native-cleanup-${{ matrix.os }}
          path: packages/cli/native/prebuilds
          if-no-files-found: error
          retention-days: 7

  native-package:
    name: Verify merged native package
    needs: native-cleanup
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-cleanup-*
          path: packages/cli/native/prebuilds
          merge-multiple: true
      - run: node packages/cli/scripts/verify-native-package.cjs
      - name: Validate package contents without publishing
        run: node scripts/publish-npm.cjs --version "$(node -p 'require("./package.json").version')" --check

  select:
    if: github.repository == 'Yu-Robotics/remote-cli' && github.ref == 'refs/heads/main' && github.event.deleted != true
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      publish: ${{ steps.release.outputs.publish }}
      version: ${{ steps.release.outputs.version }}
    steps:
      - name: Check out the requested revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          package-manager-cache: false
      - name: Select a version increase or manual recovery
        id: release
        env:
          RELEASE_BEFORE: ${{ github.event.before }}
          RELEASE_DELETED: ${{ github.event.deleted }}
          RELEASE_VERSION: ${{ inputs.version }}
        run: node scripts/select-npm-release.cjs

  publish:
    needs: [select, test, native-cleanup, native-package]
    if: needs.select.result == 'success' && needs.test.result == 'success' && needs.native-cleanup.result == 'success' && needs.native-package.result == 'success' && needs.select.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 45
    concurrency:
      group: npm-publish
      cancel-in-progress: false
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the selected revision
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Set up Node.js
        uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org
          package-manager-cache: false
      - name: Install npm with trusted publishing support
        run: npm install --global npm@11.21.1
      - name: Install locked dependencies
        run: npm ci
      - name: Build both packages
        run: npm run build
      - name: Collect tested platform helpers
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          pattern: native-cleanup-*
          path: packages/cli/native/prebuilds
          merge-multiple: true
      - name: Verify complete native helper package
        run: node packages/cli/scripts/verify-native-package.cjs
      - name: Validate release versions and package contents
        env:
          EXPECTED_VERSION: ${{ needs.select.outputs.version }}
        run: node scripts/publish-npm.cjs --version "$EXPECTED_VERSION" --check
      - name: Publish verified packages using npm OIDC
        env:
          EXPECTED_VERSION: ${{ needs.select.outputs.version }}
        run: node scripts/publish-npm.cjs --version "$EXPECTED_VERSION"
